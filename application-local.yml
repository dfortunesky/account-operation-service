spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.sybase.jdbc4.jdbc.SybDriver
    hikari:
      minimum-idle: 2
      maximum-pool-size: 10
      connection-timeout: 30000
      connection-test-query: select 1

mybatis:
  mapper-locations: classpath:mybatis/mappers/*.xml

management:
  endpoints:
    web:
      exposure:
        include: "*"
        exclude: "env,beans"
  endpoint:
    health:
      show-details: always
    logfile:
      enabled: true
    metrics:
      enabled: true
    prometheus:
      enabled: true